services:
  postfix:
    image: ghcr.io/cody-chapman/postfix:latest
    container_name: postfix
    restart: always
    ports:
      - 25:25
      - 465:465
      - 587:587
    environment:
      - TZ=America/Chicago
    volumes:
      - ./main.cf:/etc/postfix/main.cf
      - ./allowed_hosts:/etc/postfix/allowed_hosts
